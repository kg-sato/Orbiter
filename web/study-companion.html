<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Orbiter companion</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 22px;
        min-height: 100dvh;
        background:
          radial-gradient(ellipse at 80% 0%, #55406b88, transparent 65%),
          linear-gradient(145deg, #1b293a, #0b1724);
        color: #e6edf1;
        font:
          14px Avenir,
          "Segoe UI",
          sans-serif;
        text-align: center;
      }
      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 10px;
        letter-spacing: 0.18em;
        color: #c4b8e1;
      }
      button,
      select {
        font: inherit;
        color: #e7eef0;
        border: 1px solid #c9d8e533;
        border-radius: 14px;
        background: #c1b5e916;
        padding: 11px 14px;
        min-height: 42px;
      }
      button:disabled,
      select:disabled {
        opacity: 0.4;
      }
      button:focus-visible,
      select:focus-visible {
        outline: 2px solid #d4c1ef;
        outline-offset: 3px;
      }
      button:hover {
        background: #c7b4ed26;
      }
      #close {
        min-height: 30px;
        padding: 2px 10px;
      }
      #creature {
        display: block;
        width: 190px;
        height: 170px;
        margin: 8px auto;
        overflow: visible;
        filter: drop-shadow(0 14px 15px #0005);
      }
      .being {
        transform-origin: 100px 92px;
        animation: float 8s ease-in-out infinite;
      }
      .eyes {
        transform-origin: 100px 88px;
        animation: blink 9s infinite;
      }
      .aura {
        transform-origin: 100px 90px;
        animation: turn 22s linear infinite;
        opacity: 0.45;
      }
      .running .aura {
        animation-duration: 7s;
        opacity: 0.9;
      }
      .spark .being {
        animation: spark 600ms ease-out;
      }
      .calm #creature * {
        animation: none !important;
      }
      h1 {
        font-size: 38px;
        font-weight: 400;
        letter-spacing: -2px;
        margin: 4px 0;
        font-variant-numeric: tabular-nums;
      }
      #intention {
        font-size: 12px;
        line-height: 1.5;
        margin: 8px 0 18px;
        overflow-wrap: anywhere;
      }
      #toggle {
        width: 100%;
        background: linear-gradient(135deg, #beaee633, #a3c4d225);
      }
      #status {
        font-size: 11px;
        color: #b6c6d1;
        margin: 14px 0;
      }
      .practice {
        display: flex;
        gap: 8px;
        margin-top: 16px;
        align-items: center;
      }
      select {
        width: 100%;
        min-width: 0;
        font-size: 11px;
      }
      option {
        background: #22303e;
      }
      #practice-go {
        font-size: 11px;
      }
      footer {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        align-items: center;
        margin-top: 20px;
        color: #c3b7da;
        font-size: 10px;
      }
      #return {
        font-size: 10px;
        padding: 6px 10px;
        min-height: 34px;
      }
      #pet {
        border: 0;
        background: none;
        padding: 0;
        width: 100%;
        display: block;
      }
      #pet:hover {
        background: none;
      }
      #pet:disabled {
        opacity: 1;
      }
      @keyframes float {
        50% {
          transform: translateY(-7px) rotate(4deg);
        }
      }
      @keyframes turn {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes blink {
        0%,
        43%,
        46%,
        100% {
          transform: scaleY(1);
        }
        44%,
        45% {
          transform: scaleY(0.15);
        }
      }
      @keyframes spark {
        50% {
          transform: translateY(-9px) scale(1.08);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #creature * {
          animation: none !important;
        }
      }
    </style>
    <link rel="stylesheet" href="./glass.css" />
  </head>
  <body>
    <header>
      <span>ORBITER STUDY BUDDY</span
      ><button id="close" aria-label="Close companion">&times;</button>
    </header>
    <button id="pet" aria-label="Send your companion a spark">
      <svg class="" id="creature" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 150" aria-hidden="true">
<defs><radialGradient id="browser-core" cx=".35" cy=".25" r=".8"><stop stop-color="#fff8e6"/><stop offset=".65" stop-color="#f3e3cd"/><stop offset="1" stop-color="#d7bdac"/></radialGradient></defs>
<g class="being">
<ellipse cx="80" cy="137" rx="43" ry="5" fill="#101d32" opacity=".16"/>
<path class="cat-tail" d="M112 115q31 5 23-24q-4-8-10-3q-4 4 1 12q8 15-17 12" fill="#f0decd" stroke="#9c797d" stroke-width="2.5"/>
<path d="M59 100q-12 25-6 34q27 10 53-1q6-22-8-34" fill="url(#browser-core)" stroke="#9c797d" stroke-width="2.5"/>
<g class="wisp-ears"><path d="M38 54Q31 38 36 16Q39 8 45 14L66 37M94 37l20-23q7-7 10 3q4 22-4 39" fill="url(#browser-core)" stroke="#9c797d" stroke-width="2.8" stroke-linejoin="round"/><path d="M42 23l4 23l13-8M117 23l-4 23l-12-8" fill="#e6b8bd"/></g>
<path d="M39 48Q79 21 121 48Q135 62 128 87l-6 2l4 4l-8 2q-14 20-39 20Q51 113 37 96l-6-2l5-5l-5-2Q26 63 39 48Z" fill="url(#browser-core)" stroke="#9c797d" stroke-width="2.8" stroke-linejoin="round"/>
<path class="wisp-shine" d="M47 46q25-17 47-8" fill="none" stroke="#fffdf4" stroke-width="5" stroke-linecap="round" opacity=".8"/>
<g class="wisp-face"><g class="cat-content-eyes"><path d="M49 73q7-7 14 0M97 73q7-7 14 0" fill="none" stroke="#587583" stroke-width="3" stroke-linecap="round"/></g><g class="wisp-gaze"><ellipse cx="56" cy="72" rx="5" ry="6.5" fill="#587583"/><ellipse cx="104" cy="72" rx="5" ry="6.5" fill="#587583"/><circle cx="54.5" cy="70" r="1.2" fill="#fff8e6"/><circle cx="102.5" cy="70" r="1.2" fill="#fff8e6"/></g>
<g class="wisp-cheeks"><ellipse cx="45" cy="85" rx="9" ry="5" fill="#e7aba2" opacity=".65"/><ellipse cx="115" cy="85" rx="9" ry="5" fill="#e7aba2" opacity=".65"/><path d="M43 82l-2 5m6-4-1 5m65-6-1 5m6-4-1 5" stroke="#fff1df" stroke-width="1.5"/></g>
<path class="smile" d="M72 87q8 9 16 0" fill="none" stroke="#ac747a" stroke-width="1.8"/>
<path d="M77 80q3-2 6 0l-3 3Z" fill="#be8b91"/><circle cx="70" cy="80" r="1" fill="#ba8e7e"/><circle cx="89" cy="81" r="1" fill="#ba8e7e"/></g>
<g class="cat-scarf"><path d="M63 109q17 6 35 0l-2 10q-18 5-33-1Z" fill="#719cba" stroke="#577d9b" stroke-width="1.5"/><path d="M78 117q-18-14-19 0q-1 11 17 3m8-3q18-14 19 0q1 11-17 3" fill="#86b3c8" stroke="#577d9b" stroke-width="1.5"/><circle cx="81" cy="118" r="4" fill="#a5cdbb"/></g>
<g class="cat-paw paw-left"><path d="M54 118q-11-2-11 6q-1 10 12 9" fill="#f8ecd9" stroke="#9c797d" stroke-width="2.3" stroke-linecap="round"/></g>
<g class="cat-paw paw-right"><path d="M106 118q11-2 11 6q1 10-12 9" fill="#f8ecd9" stroke="#9c797d" stroke-width="2.3" stroke-linecap="round"/></g>
<path class="cat-pat-spark" d="M73 10q-8-10-12-2q-4 8 12 17q16-9 12-17q-4-8-12 2Z" fill="#e4aab9"/><g class="cat-decoration halo"><path d="M24 37l2-7l3 7l7 2l-7 2l-3 7l-2-7l-7-2Z" fill="#b8a0ce"/><path d="M139 66l2-5l2 5l5 2l-5 2l-2 5l-2-5l-5-2Z" fill="#b0ceaf"/><circle cx="134" cy="43" r="3" fill="#edb496"/>
<path d="M19 100q-7 4-3 12m5-8q-4 3-2 6" fill="none" stroke="#d5a59d" stroke-width="2" stroke-linecap="round"/></g>
</g></svg>
    </button>
    <h1 id="time">--:--</h1>
    <p id="intention">Open this companion from Scheduler.</p>
    <button id="toggle" disabled>Start focus</button>
    <p id="status" role="status">Waiting for Scheduler</p>
    <div class="practice">
      <select id="practice" aria-label="Study project" disabled>
        <option value="">Choose a study project</option></select
      ><button id="practice-go" disabled>Focus</button>
    </div>
    <footer>
      <span id="progress">Seed ? 0m today</span
      ><button id="return" disabled>Return &nearr;</button>
    </footer>
    <script src="./study-companion.js"></script>
  </body>
</html>
