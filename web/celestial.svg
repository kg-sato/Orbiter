    <linearGradient id="celestial-ribbon" x1=".1" y1="0" x2=".7" y2="1"><stop stop-color="#d9eee5" stop-opacity=".44"/><stop offset=".22" class="scene-accent-stop" stop-color="#b4e6d5" stop-opacity=".25"/><stop offset=".55" stop-color="#8e9db7" stop-opacity=".06"/><stop offset=".8" stop-color="#b8a3dc" stop-opacity=".24"/><stop offset="1" stop-color="#b4c5df" stop-opacity=".08"/></linearGradient>
