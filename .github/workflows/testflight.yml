name: Build and upload to TestFlight

on:
  workflow_dispatch:
    inputs:
      upload:
        description: Upload a signed build to TestFlight after the build check
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  iphone:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check native compilation without signing
        run: |
          python3 scripts/sync_app.py
          python3 scripts/check_iphone.py --sdk
          xcodebuild -project Scheduler.xcodeproj -scheme Scheduler \
            -configuration Debug -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/Scheduler-validation" \
            CODE_SIGNING_ALLOWED=NO build
      - name: Check simulator runner safety
        run: python3 scripts/test_iphone_simulator.py
      - name: Check notification lifecycle logic
        run: python3 scripts/test_iphone_notifications.py
      - name: Exercise the app in a disposable iPhone simulator
        timeout-minutes: 20
        run: |
          python3 scripts/run_iphone_simulator.py \
            --app "$RUNNER_TEMP/Scheduler-validation/Build/Products/Debug-iphonesimulator/Scheduler.app" \
            --output build/iphone-simulator
      - name: Save simulator evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: iphone-simulator-evidence
          path: build/iphone-simulator/
          if-no-files-found: warn
          retention-days: 14
      - name: Sign and upload
        if: ${{ inputs.upload }}
        env:
          TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          BUNDLE_ID: ${{ vars.APPLE_BUNDLE_ID }}
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: python3 scripts/ci_testflight.py
